[package]
name = "disk_flashlight"
version = "0.2.0"
edition = "2024"
description = "Disk space analyzer with a sunburst (sector) chart, in the spirit of OverDisk"
repository = "https://github.com/Fan4Metal/disk_flashlight"
license = "MIT"

[dependencies]
eframe = "0.36"
egui = "0.36"
rayon = "1.12"
crossbeam-channel = "0.5"
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
